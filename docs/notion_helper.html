  <h2>1. 메인 본문 교체용 (한글 깨짐 완벽 복구본)</h2>
  <textarea id="main_fix">💡 축제 부스 방문객이 QR 코드로 접속하여 메뉴를 고르고 현금 또는 개인 송금(계좌이체·카카오페이·토스)으로 결제하면, 운영진이 실시간 대시보드에서 입금 확인·조리·호출을 관리하는 웹 서비스입니다.

### 📌 핵심 프로젝트 정보
- **축제 운영 기간**: 2026-10-07(수) ~ 10-08(목) (2일간, 예상 주문 200건/일)
- **1차(필수) 마감**: 2026-10-04(일)
- **2차(선택) 개발**: 2026-10-05(월) ~ 10-06(화)
- **기술 스택**: Next.js (App Router), React, TypeScript, Tailwind CSS, Supabase, Vercel
- **결제 방식**: 현금 & 개인 송금 (계좌이체·카카오페이·토스) 관리자 수동 승인
- **테스트 & CI**: Vitest (단위), Playwright (E2E), GitHub Actions CI

### 🤝 팀 협업 규칙 (Team Rules)
- **작업 상태 변경 승인**: 모든 작업의 상태 변경(Done 전환 등)은 PM 승인 후 반영
- **Daily Async Standup**: 매일 오전 10시까지 Discord/카톡에 (1)어제 한 일 (2)오늘 할 일 (3)블로커 공유
- **PR 및 코드 리뷰**: 모든 PR은 최신 main 브랜치 rebase 및 CI 통과 필수
- **긴급 연락망**: 블로커 발생 시 2시간 이내 PM 및 관련 담당자 핑

### 🅱️ Definition of Done (완료 정의)
- **단위 테스트 통과**: Vitest 단위 테스트 및 Playwright E2E 테스트 통과
- **TypeScript 타입 체크**: 타입 오류 및 ESLint 경고 0건
- **RLS 보안 검증**: Supabase RLS 정책 적용 및 미인증 접근 차단 테스트 완료
- **PM 최종 검수**: PM의 기능 동작 검수 및 최종 승인 완료</textarea>
