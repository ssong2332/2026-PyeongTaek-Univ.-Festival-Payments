# Architecture "테스트 전략" CI 행 · DECISIONS #34 — 잡 ① unit-build (T-01). 잡 ② integration은 T-02에서 추가.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  unit-build:
    runs-on: ubuntu-latest
    env:
      # 빌드는 DB에 접속하지 않는다 — 더미 값 (Architecture CI 행). 시크릿 0개.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
